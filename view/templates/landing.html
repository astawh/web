{{ define "action-icon" }}<svg class="asta-action-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27 27" width="40" height="40" aria-hidden="true" focusable="false"><circle class="asta-action-icon__circle" cx="13.5" cy="13.5" r="13.5"/><g class="asta-action-icon__arrow"><path d="m17.701 13.526-3.827-3.828L14.973 8.6l4.926 4.926-4.926 4.926-1.099-1.099 3.827-3.827Z"/><path d="M8.363 12.749h9.762v1.554H8.363v-1.554Z"/></g></svg>{{ end }}
{{ define "landing" }}
<div class="asta-masthead">
  <div class="govuk-width-container">
    <h1 class="govuk-heading-xl asta-masthead__title">Hilfe und Angebote fürs Studium</h1>
    <form class="asta-search asta-search--masthead" action="/suche" method="get" role="search" aria-label="Angebote und Informationen durchsuchen">
      <label class="govuk-label govuk-label--s" for="landing-search">Suche</label>
      <div class="asta-search__controls">
        <input id="landing-search" class="govuk-input asta-search__input" name="q" type="search" enterkeyhint="search" maxlength="200">
        <button class="asta-search__submit" type="submit"><span class="govuk-visually-hidden">{{ .SiteName }} durchsuchen</span>{{ template "search-icon" }}</button>
      </div>
    </form>
  </div>
</div>
<section class="asta-popular" aria-labelledby="popular-heading">
  <div class="govuk-width-container">
    <h2 id="popular-heading" class="govuk-heading-l">Häufig gesucht</h2>
    <ul class="asta-popular__links">
      <li><a class="govuk-link asta-popular__link" href="https://www.asta-wh.de/semesterticket/">{{ template "action-icon" }}<span>Semesterticket</span></a></li>
      <li><a class="govuk-link asta-popular__link" href="https://www.asta-wh.de/wp-content/uploads/2026/06/Anmeldung_Sportkeller.pdf">{{ template "action-icon" }}<span>Sportkeller-Anmeldung<span class="govuk-visually-hidden"> (PDF)</span></span></a></li>
      <li><a class="govuk-link asta-popular__link" href="https://www.asta-wh.de/beratung/">{{ template "action-icon" }}<span>Beratung</span></a></li>
    </ul>
  </div>
</section>
{{ end }}
