{{ define "footer" }}
<footer class="govuk-footer asta-footer">
  <div class="govuk-width-container">
    <nav class="govuk-footer__navigation" aria-label="Weitere Angebote und Informationen">
      {{ range $index, $group := .Footer }}
      <div class="{{ if eq $index 0 }}govuk-grid-column-two-thirds{{ else }}govuk-grid-column-one-third{{ end }}">
        <h2 class="govuk-footer__heading govuk-heading-m">{{ .Title }}</h2>
        <ul class="govuk-footer__list{{ if eq $index 0 }} govuk-footer__list--columns-2{{ end }}">
          {{ range .Links }}<li class="govuk-footer__list-item"><a class="govuk-footer__link" href="{{ .URL }}">{{ .Title }}</a></li>{{ end }}
        </ul>
      </div>
      {{ end }}
    </nav>
    <hr class="govuk-footer__section-break">
    <div class="govuk-footer__meta">
      <div class="govuk-footer__meta-item govuk-footer__meta-item--grow">
        <h2 class="govuk-visually-hidden">Hilfe und rechtliche Informationen</h2>
        <ul class="govuk-footer__inline-list">
          <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="/hilfe">Hilfe</a></li>
          <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="https://www.asta-wh.de/datenschutz/">Datenschutz</a></li>
          <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="/barrierefreiheit">Barrierefreiheit</a></li>
          <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="https://www.asta-wh.de/kontakt/">Kontakt</a></li>
          <li class="govuk-footer__inline-list-item"><a class="govuk-footer__link" href="https://www.asta-wh.de/impressum/">Impressum</a></li>
        </ul>
      </div>
      <div class="govuk-footer__meta-item asta-footer__signature">
        <a class="asta-footer__brand" href="/" aria-label="{{ .SiteName }} – Startseite"><img src="/assets/logo.svg" width="160" height="80" alt="{{ .SiteName }}"></a>
      </div>
    </div>
  </div>
</footer>
{{ end }}
